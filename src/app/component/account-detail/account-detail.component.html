<div class="mt-3">
  <table mat-table [dataSource]="dataSource" mat-elevation-z24 matSort>
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Date </th>
      <td mat-cell *matCellDef="let transaction"> {{transaction.date | date:'medium'}} </td>
    </ng-container>

    <ng-container matColumnDef="transactionType">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Transaction Type </th>
      <td mat-cell *matCellDef="let transaction"> {{transaction.transactionType}} </td>
    </ng-container>

    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Amount </th>
      <td mat-cell *matCellDef="let transaction"> {{transaction.amount | currency}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>
  <mat-divider></mat-divider>
  <mat-paginator [length]="this.totalElements" [pageSize]="this.size" [pageSizeOptions]="[5, 10, 20]"
    [showFirstLastButtons]="true" (page)="handlePageEvent($event)" aria-label="Select page">
  </mat-paginator>
</div>
<div>
  <a href="/dashboard"><button mat-raised-button
      color="primary mt-2"><mat-icon>arrow_back</mat-icon> Return</button></a>
</div>
