<div class="card mt-2">
    <h5 class="card-header">
        <h6 class="mt-3">{{account.accountType}} Account ({{account.accountNumber}})</h6>
    </h5>
    <div class="card-body">
        <h5 class="card-title">Balance: ({{account.accountBalance | currency}})</h5>
        <form #transactionForm="ngForm" (ngSubmit)="onSubmit()" ngNativeValidate>
            <label for="flexRadioDefault1" class="form-label">Select Transaction type</label>
            <div class="form-check mb-3">
                <input value="Deposit" class="form-check-input" type="radio" name="flexRadioDefault"
                    id="flexRadioDefault1" [(ngModel)]="transaction.transactionType" required>
                <label class="form-check-label" for="flexRadioDefault1">
                    Deposit
                </label>
            </div>
            <div class="form-check mb-3">
                <input value="Withdraw" class="form-check-input" type="radio" name="flexRadioDefault"
                    id="flexRadioDefault2" [(ngModel)]="transaction.transactionType" required>
                <label class="form-check-label" for="flexRadioDefault2">
                    Withdraw
                </label>
            </div>
            <div class="mb-3" id="inputAmountTest">
                {{amountToCurrency}}
            </div>
            <div class="form-floating mb-3">
                <input type="number" min=1 class="form-control" id="inputAmount" step='0.01' (keyup)="onKeydown($event)"
                    [(ngModel)]="transaction.amount" name="Amount" required placeholder="0.00">
                <label for="floatingInput">Amount</label>
                <div class="text-danger mt-2"
                    *ngIf="(account.accountBalance < transaction.amount) && transaction.transactionType === 'Withdraw'">
                    Insufficient funds to withdraw.</div>
            </div>
            <button type="button" class="btn btn-primary me-2" data-bs-toggle="modal" data-bs-target="#addTransactionButton"
                [disabled]="transactionForm.invalid || (account.accountBalance < transaction.amount) && transaction.transactionType === 'Withdraw'">Submit</button>
            <a class="btn btn-secondary" href="#" role="button">Return Home</a>
        </form>
    </div>
</div>

<div class="modal fade" id="addTransactionButton" tabindex="-1" aria-labelledby="addTransactionButtonLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="addTransactionButtonLabel">Add Transaction</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Are you sure you would like to make this transaction?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal"
                    (click)="onSubmit()">Submit</button>
            </div>
        </div>
    </div>
</div>
