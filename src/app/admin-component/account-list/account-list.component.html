<div class="mt-3 mat-elevation-z8">
    <mat-toolbar>
        <span class="me-auto">Account Directory</span>
    </mat-toolbar>
    <table mat-table [dataSource]="dataSource">
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef> Account ID </th>
            <td mat-cell *matCellDef="let account"> {{account.id}} </td>
        </ng-container>

        <ng-container matColumnDef="accountNumber">
            <th mat-header-cell *matHeaderCellDef> Account Number </th>
            <td mat-cell *matCellDef="let account"> {{account.accountNumber}} </td>
        </ng-container>

        <ng-container matColumnDef="accountType">
            <th mat-header-cell *matHeaderCellDef> Account Type </th>
            <td mat-cell *matCellDef="let account"> {{account.accountType}} </td>
        </ng-container>

        <ng-container matColumnDef="accountBalance">
            <th mat-header-cell *matHeaderCellDef> Balance </th>
            <td mat-cell *matCellDef="let account"> {{account.accountBalance | currency}} </td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Actions </th>
            <td mat-cell *matCellDef="let account">
                <a href="/accounts/{{account.id}}"><button class="me-2" mat-mini-fab matTooltip="View Account">
                        <mat-icon>visibility</mat-icon>
                    </button></a>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
    <mat-divider></mat-divider>
    <mat-paginator [length]="this.totalElements" [pageSize]="this.size" [pageSizeOptions]="[5, 10, 20]"
        [showFirstLastButtons]="true" (page)="handlePageEvent($event)" aria-label="Select page">
    </mat-paginator>
</div>
