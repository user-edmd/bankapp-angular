<div class="mt-3 mat-elevation-z8">
    <mat-toolbar>
        <span class="me-auto">User Directory</span>
        <a href="/addUser" mat-raised-button><mat-icon>person_add</mat-icon> Add
            User</a>
      </mat-toolbar>
    <table mat-table [dataSource]="dataSource">
        <p>test</p>
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef> User ID </th>
            <td mat-cell *matCellDef="let user"> {{user.id}} </td>
        </ng-container>

        <ng-container matColumnDef="username">
            <th mat-header-cell *matHeaderCellDef> Username </th>
            <td mat-cell *matCellDef="let user"> {{user.username}} </td>
        </ng-container>

        <ng-container matColumnDef="firstName">
            <th mat-header-cell *matHeaderCellDef> First Name </th>
            <td mat-cell *matCellDef="let user"> {{user.firstName}} </td>
        </ng-container>

        <ng-container matColumnDef="lastName">
            <th mat-header-cell *matHeaderCellDef> Last Name </th>
            <td mat-cell *matCellDef="let user"> {{user.lastName}} </td>
        </ng-container>

        <ng-container matColumnDef="accounts">
            <th mat-header-cell *matHeaderCellDef> Accounts </th>
            <td mat-cell *matCellDef="let user"> {{user.accountList.length}} </td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Actions </th>
            <td mat-cell *matCellDef="let user">
                <a href="/addAccountToUser/{{user.id}}"><button class="me-2" mat-mini-fab matTooltip="Add Account">
                    <mat-icon>add_box</mat-icon>
                </button></a>
                <a href="/users/{{user.id}}"><button class="me-2" mat-mini-fab matTooltip="View Accounts">
                        <mat-icon>visibility</mat-icon>
                    </button></a>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
    <mat-divider></mat-divider>
    <mat-paginator [length]="this.totalElements" [pageSize]="this.size" [pageSizeOptions]="[5, 10, 20]"
        [showFirstLastButtons]="true" (page)="handlePageEvent($event)" aria-label="Select page">
    </mat-paginator>
</div>
