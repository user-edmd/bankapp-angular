<mat-card>
    <mat-card-header>
        <h5>User Directory</h5>
    </mat-card-header>
    <mat-card-content>
        <div>
            <table class="table">
                <thead>
                    <th>User ID</th>
                    <th>Username</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Accounts</th>
                </thead>
                <tbody>
                    @for (user of users; track user.id) {
                    <tr>
                        <td><a mat-button href="/users/{{user.id}}">{{user.id}}</a></td>
                        <td>{{user.username}}</td>
                        <td>{{user.firstName}}</td>
                        <td>{{user.lastName}}</td>
                        <td>{{user.accountList.length}}</td>
                    </tr>
                    }
                </tbody>
            </table>
            <mat-paginator [length]="this.totalElements" [pageSize]="this.size" [pageSizeOptions]="[5, 10, 20]"
                [showFirstLastButtons]="true" (page)="handlePageEvent($event)" aria-label="Select page">
            </mat-paginator>
        </div>
        <div>
            <a href="/register"><button mat-raised-button color="primary" href="#"> Add User</button></a>
        </div>
    </mat-card-content>
</mat-card>
