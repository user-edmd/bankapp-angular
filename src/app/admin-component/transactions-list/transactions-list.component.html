<div class="mt-3 mat-elevation-z8">
    <mat-toolbar>
        <span class="me-auto">Transaction Directory</span>
    </mat-toolbar>
    <table mat-table [dataSource]="dataSource">
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef> Transaction ID </th>
            <td mat-cell *matCellDef="let transaction"> {{transaction.id}} </td>
        </ng-container>

        <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef> Date </th>
            <td mat-cell *matCellDef="let transaction"> {{transaction.date | date:'medium'}} </td>
        </ng-container>

        <ng-container matColumnDef="type">
            <th mat-header-cell *matHeaderCellDef> Transaction Type </th>
            <td mat-cell *matCellDef="let transaction"> {{transaction.transactionType}} </td>
        </ng-container>

        <ng-container matColumnDef="amount">
            <th mat-header-cell *matHeaderCellDef> Amount </th>
            <td mat-cell *matCellDef="let transaction"> {{transaction.amount | currency}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
    <mat-divider></mat-divider>
    <mat-paginator [length]="this.totalElements" [pageSize]="this.size" [pageSizeOptions]="[5, 10, 20]"
        [showFirstLastButtons]="true" (page)="handlePageEvent($event)" aria-label="Select page">
    </mat-paginator>
</div>
