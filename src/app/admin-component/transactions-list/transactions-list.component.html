<mat-card>
    <mat-card-header>
        <h5>Transaction Directory</h5>
    </mat-card-header>
    <mat-card-content>
        <div>
            <table class="table">
                <thead>
                    <th>Transaction ID</th>
                    <th>Transaction Date</th>
                    <th>Transaction Type</th>
                    <th>Amount</th>
                </thead>
                <tbody>
                    @for (transaction of transactions; track transaction.id) {
                    <tr>
                        <td>{{transaction.id}}</td>
                        <td>{{transaction.date | date:'medium'}}</td>
                        <td>{{transaction.transactionType}}</td>
                        <td>{{transaction.amount | currency}}</td>
                    </tr>
                    }
                </tbody>
            </table>
            <mat-paginator [length]="this.totalElements" [pageSize]="this.size" [pageSizeOptions]="[10, 25, 50]"
                [showFirstLastButtons]="true" (page)="handlePageEvent($event)" aria-label="Select page">
            </mat-paginator>
        </div>
    </mat-card-content>
</mat-card>
