<mat-card>
  <mat-card-header>
    <h5>{{this.user?.firstName}} {{this.user?.lastName}}</h5>
  </mat-card-header>
  <mat-card-content>
    <div>
      <table class="table">
        <thead>
          <th>Account ID</th>
          <th>Account Number</th>
          <th>Account Type</th>
          <th>Balance</th>
        </thead>
        <tbody>
          @for (account of accounts; track account.id) {
          <tr>
            <td><a mat-stroked-button href="/accounts/{{account.id}}">{{account.id}}</a></td>
            <td>{{account.accountNumber}}</td>
            <td>{{account.accountType}}</td>
            <td>{{account.accountBalance | currency}}</td>
          </tr>
          }
        </tbody>
      </table>
      <!-- <mat-paginator [length]="this.totalElements" [pageSize]="10" [pageSizeOptions]="[5, 10, 20]" [showFirstLastButtons]="true"
              (page)="handlePageEvent($event)" aria-label="Select page">
          </mat-paginator> -->
    </div>
    <div>
      <a href="#"><button mat-raised-button color="primary mt-2" href="#"><svg xmlns="http://www.w3.org/2000/svg"
            height="24px" viewBox="0 -960 960 960" width="24px" fill="#5f6368">
            <path d="m313-440 224 224-57 56-320-320 320-320 57 56-224 224h487v80H313Z" />
          </svg> Return Home</button></a>
    </div>
  </mat-card-content>
</mat-card>
