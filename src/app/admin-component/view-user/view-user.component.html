<mat-card>
  <mat-card-header>
    <h5>{{this.user?.firstName}} {{this.user?.lastName}}</h5>
  </mat-card-header>
  <mat-card-content>
    <div>
      <table class="table">
        <thead>
          <th>Account ID</th>
          <th>Account Number</th>
          <th>Account Type</th>
          <th>Balance</th>
          <th>Actions</th>
        </thead>
        <tbody>
          @for (account of accounts; track account.id) {
          <tr>
            <td>{{account.id}}</td>
            <td>{{account.accountNumber}}</td>
            <td>{{account.accountType}}</td>
            <td>{{account.accountBalance | currency}}</td>
            <td>
              <a href="/accounts/{{account.id}}"><button class="me-2" mat-mini-fab matTooltip="View Transactions"> 
                <mat-icon>visibility</mat-icon>
            </button></a>
            </td>
          </tr>
          }
        </tbody>
      </table>
    </div>
    <div>
      <a href="#"><button class="me-2" mat-raised-button color="primary mt-2" href="#"><mat-icon>arrow_back</mat-icon> Return Home</button></a>
      <a href="/addAccountToUser/{{this.user?.id}}"><button class="me-2" mat-raised-button color="primary mt-2"><mat-icon>add</mat-icon>Add Account</button></a>
      <a href="/editUser/{{this.user?.id}}"><button mat-raised-button color="primary mt-2"><mat-icon>edit</mat-icon>Edit Account</button></a>
    </div>
  </mat-card-content>
</mat-card>
