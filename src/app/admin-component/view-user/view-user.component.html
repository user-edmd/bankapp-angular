<div class="mt-3 mat-elevation-z8">
  <mat-toolbar>
    <span class="me-auto">{{this.user?.firstName}} {{this.user?.lastName}}</span>
    <button mat-icon-button [matMenuTriggerFor]="menu"><mat-icon>more_vert</mat-icon></button>
    <mat-menu #menu="matMenu">
      <a mat-menu-item href="/addAccountToUser/{{this.user?.id}}">
        <mat-icon>add</mat-icon>
        <span>New Account</span>
      </a>
      <a mat-menu-item href="/editUser/{{this.user?.id}}">
        <mat-icon>edit</mat-icon>
        <span>Edit Profile</span>
      </a>
    </mat-menu>
  </mat-toolbar>
  <table mat-table [dataSource]="dataSource">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> Account ID </th>
      <td mat-cell *matCellDef="let account"> {{account.id}} </td>
    </ng-container>

    <ng-container matColumnDef="accountNumber">
      <th mat-header-cell *matHeaderCellDef> Account Number </th>
      <td mat-cell *matCellDef="let account"> {{account.accountNumber}} </td>
    </ng-container>

    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef> Account Type </th>
      <td mat-cell *matCellDef="let account"> {{account.accountType}} </td>
    </ng-container>

    <ng-container matColumnDef="balance">
      <th mat-header-cell *matHeaderCellDef> Balance </th>
      <td mat-cell *matCellDef="let account"> {{account.accountBalance | currency}} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let account">
        <button mat-icon-button [matMenuTriggerFor]="menu"><mat-icon>menu</mat-icon></button>
        <mat-menu #menu="matMenu">
          <a mat-menu-item href="/accounts/{{account.id}}">
            <mat-icon>list</mat-icon>
            <span>View Transactions</span>
          </a>
        </mat-menu>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
<a href="#" class="my-3" mat-raised-button><mat-icon>arrow_back</mat-icon> Return
  Home</a>
